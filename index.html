<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <h1>📝 My To-Do List</h1>
  <p>Write your tasks and manage them easily</p>

  <div class="input-section">
    <input type="text" id="taskInput" placeholder="Enter a task">
    <input type="date" id="taskDate">
    <button id="addBtn">Add</button>
  </div>

  <div class="color-section">
    <label for="taskColor">Task Color:</label>
    <select id="taskColor">
      <option value="#fff3e0">Orange</option>
      <option value="#b3e5fc">Blue</option>
      <option value="#c8e6c9">Green</option>
      <option value="#e1bee7">Purple</option>
    </select>
  </div>

  <ul id="taskList"></ul>
</div>

<script src="script.js"></script>

</body>
</html>
